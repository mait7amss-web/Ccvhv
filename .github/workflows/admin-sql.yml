name: Admin SQL

on:
  workflow_dispatch:
    inputs:
      query:
        description: "SQL to run"
        required: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/admin-sql.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: bnjwhkilboybexkdvufc
          QUERY: ${{ inputs.query }}

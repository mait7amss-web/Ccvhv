name: Deploy Supabase functions

on:
  push:
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Deploy notify-message
        run: supabase functions deploy notify-message --project-ref bnjwhkilboybexkdvufc --no-verify-jwt --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy live-sync
        run: supabase functions deploy live-sync --project-ref bnjwhkilboybexkdvufc --no-verify-jwt --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Pass the API-Football key to the live feed (if it's set)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            supabase secrets set API_FOOTBALL_KEY="$KEY" --project-ref bnjwhkilboybexkdvufc
          else
            echo "API_FOOTBALL_KEY not set in GitHub secrets yet"
          fi

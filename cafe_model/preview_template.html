<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mimadoz Cake 3D</title>
<style>
:root{--bg:#e9e3d9;--panel:#fffaf2;--ink:#2d2a26;--accent:#7f8f6a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1d1a;--panel:#2b2824;--ink:#f0ebe3;--accent:#a9b893}}
:root[data-theme="dark"]{--bg:#1f1d1a;--panel:#2b2824;--ink:#f0ebe3;--accent:#a9b893}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
#ui{position:fixed;top:12px;right:12px;left:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none}
#ui>*{pointer-events:auto}
h1{font-size:16px;margin:0 0 0 auto;padding:8px 12px;background:var(--panel);border-radius:10px}
button{font:inherit;font-size:14px;border:1px solid var(--accent);background:var(--panel);color:var(--ink);padding:8px 12px;border-radius:10px;cursor:pointer}
button.on{background:var(--accent);color:#fff}
#hint{position:fixed;bottom:12px;right:12px;left:12px;text-align:center;font-size:13px;opacity:.75}
canvas{display:block}
#gal{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;box-sizing:border-box;z-index:5}
#gal-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
#grid figure{margin:0;background:var(--panel);border-radius:12px;overflow:hidden;cursor:zoom-in}
#grid img{width:100%;display:block}#grid figcaption{padding:8px 12px;font-size:14px}
#big{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:zoom-out;padding:16px;box-sizing:border-box}
#big[hidden],#gal[hidden]{display:none}#big img{max-width:100%;max-height:85vh;border-radius:8px}#big-cap{color:#fff;margin-top:10px}
</style></head><body>
<div id="ui"><h1>Mimadoz Cake · معاينة</h1>
<button id="b-canopy" class="on">المظلة</button>
<button id="b-fences" class="on">الحواجز</button>
<button id="b-front">من قدام</button>
<button id="b-top">من فوق</button>
<button id="b-iso">زاوية</button>
<button id="b-gal">الصور</button></div>
<div id="gal" hidden><div id="gal-head"><b>صور من كل الاتجاهات</b><button id="gal-x">رجوع للمجسّم</button></div><div id="grid"></div></div>
<div id="big" hidden><img id="big-img" alt=""><div id="big-cap"></div></div>
<div id="hint">اسحب للتدوير · قرّب بإصبعين أو بعجلة الماوس · المقاس 300×300 مم</div>
<script>/*THREE*/</script>
<script>/*DATA*/
const W=innerWidth,H=innerHeight;
const r=new THREE.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(W,H);
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(r.domElement);
const s=new THREE.Scene();
const bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();s.background=new THREE.Color(bg);
s.add(new THREE.HemisphereLight(0xfff6e8,0x8a7c6a,0.75));
const d=new THREE.DirectionalLight(0xffffff,0.9);d.position.set(-120,-220,380);d.target.position.set(150,150,0);d.castShadow=true;
Object.assign(d.shadow.camera,{left:-260,right:260,top:260,bottom:-260,near:1,far:1200});d.shadow.mapSize.set(2048,2048);d.shadow.bias=-0.0006;
s.add(d,d.target);
const cam=new THREE.PerspectiveCamera(35,W/H,1,4000);cam.up.set(0,0,1);
const ctl=new THREE.OrbitControls(cam,r.domElement);ctl.target.set(150,140,25);ctl.enableDamping=true;
const views={front:[180,-330,160],top:[150,130,560],iso:[-80,-280,380]};
function go(v){cam.position.set(...views[v]);ctl.update();}
const loader=new THREE.STLLoader(),meshes={};
const colors={body:0xeee6d8,canopy:0xfbf9f4,fences:0x26262a};
for(const [k,b] of Object.entries(DATA)){
 const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0)).buffer;const g=loader.parse(bin);
 const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:colors[k],roughness:.85,metalness:k==='fences'?.3:0}));
 m.castShadow=m.receiveShadow=true;s.add(m);meshes[k]=m;}
for(const k of ['canopy','fences']){const b=document.getElementById('b-'+k);
 b.onclick=()=>{meshes[k].visible=!meshes[k].visible;b.classList.toggle('on',meshes[k].visible);};}
for(const v in views)document.getElementById('b-'+v).onclick=()=>go(v);
/*GALLERY*/
const grid=document.getElementById('grid'),gal=document.getElementById('gal'),big=document.getElementById('big');
for(const [cap,src] of GALLERY){const f=document.createElement('figure');f.innerHTML=`<img src="${src}" alt="${cap}"><figcaption>${cap}</figcaption>`;
 f.onclick=()=>{document.getElementById('big-img').src=src;document.getElementById('big-cap').textContent=cap;big.hidden=false;};grid.appendChild(f);}
document.getElementById('b-gal').onclick=()=>gal.hidden=false;document.getElementById('gal-x').onclick=()=>gal.hidden=true;big.onclick=()=>big.hidden=true;
go(innerWidth<700?'top':'iso');
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);});
(function loop(){ctl.update();r.render(s,cam);requestAnimationFrame(loop);})();
</script></body></html>

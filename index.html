<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08130d">
<title>هلا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@400;600;700;800&display=swap">
<style>
/* Night-match stadium: dark pitch ground, mown stripes behind the thread,
   floodlight glow on the sign-in screen. Accent follows the selected league. */
:root {
  --pitch: #08130d;
  --pitch-2: #0d1d14;
  --stripe: rgba(255,255,255,.018);
  --card: #13261b;
  --card-2: #193324;
  --line: #24402f;
  --chalk: #eef5ef;
  --muted: #8fa898;
  --turf: #2fbf5b;
  --turf-ink: #04140a;
  --flood: #f4f8d8;
  --danger: #ff7a5c;
  --league: #2fbf5b;
  --league-ink: #ffffff;
  --display: "Lalezar", "Cairo", system-ui, sans-serif;
  --body: "Cairo", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: dark;
}
body[data-league="epl"]        { --league: #8f3fd6; --league-ink: #ffffff; }
body[data-league="laliga"]     { --league: #ff4b3e; --league-ink: #ffffff; }
body[data-league="seriea"]     { --league: #1aa3ff; --league-ink: #04131f; }
body[data-league="bundesliga"] { --league: #e4202b; --league-ink: #ffffff; }
body[data-league="ligue1"]     { --league: #dae025; --league-ink: #0d1400; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--pitch); color: var(--chalk); font-family: var(--body); font-size: 15px;
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--flood); outline-offset: 2px; }
.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 760px; width: 100%; margin-inline: auto;
}

/* ---------- Header ---------- */
header { background: var(--pitch-2); border-bottom: 1px solid var(--line); flex: none; }
.top { padding-block: 10px; display: flex; align-items: center; gap: 12px; }
.badge {
  width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--turf); color: var(--turf-ink); font-family: var(--display); font-size: 20px; line-height: 1;
  box-shadow: inset 0 0 0 3px var(--pitch-2), 0 0 0 2px var(--turf);
}
.brand { min-width: 0; flex: 1; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; letter-spacing: .01em; }
.brand p { margin: 3px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ghost { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; flex: none; }

/* League tabs: five equal cells, like a scoreboard row */
.leagues { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; padding-block: 0 10px; }
.lg {
  border: 1px solid var(--line); background: var(--card); color: var(--muted); cursor: pointer;
  border-radius: 12px; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  position: relative; overflow: hidden; min-width: 0;
}
.lg .flag { font-size: 20px; line-height: 1; }
.lg .nm { font-size: 12px; font-weight: 700; white-space: nowrap; }
.lg::after { content: ""; position: absolute; inset: auto 0 0; height: 3px; background: var(--c); opacity: .35; }
.lg[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--ci); }
.lg[aria-pressed="true"]::after { opacity: 0; }

/* Strip naming the open league */
.strip { background: var(--league); color: var(--league-ink); flex: none; }
.strip .wrap { padding-block: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.strip b { font-family: var(--display); font-weight: 400; font-size: 17px; letter-spacing: .01em; }
.strip span { font-size: 12px; font-weight: 600; opacity: .85; }

/* ---------- Thread on the pitch ---------- */
main {
  flex: 1; overflow-y: auto; min-height: 0;
  background:
    repeating-linear-gradient(180deg, var(--stripe) 0 56px, transparent 56px 112px),
    var(--pitch);
}
#thread { padding-block: 12px 20px; display: flex; flex-direction: column; gap: 6px; }
.day { align-self: center; font-size: 11.5px; font-weight: 700; color: var(--muted); border: 1px solid var(--line); background: var(--pitch-2); padding: 2px 12px; border-radius: 999px; margin-block: 8px; }
.row { display: flex; gap: 8px; align-items: flex-end; max-width: 84%; }
.row.mine { align-self: flex-start; }
.row.theirs { align-self: flex-end; flex-direction: row-reverse; }
.avatar { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 800; }
.row.mine .avatar, .row.cont .avatar { visibility: hidden; }
.bubble { min-width: 0; padding: 7px 12px 5px; border-radius: 16px; line-height: 1.6; background: var(--card); border: 1px solid var(--line); overflow-wrap: anywhere; white-space: pre-wrap; }
.mine .bubble { background: var(--league); color: var(--league-ink); border-color: transparent; border-bottom-left-radius: 4px; }
.theirs .bubble { border-bottom-right-radius: 4px; }
.who { font-size: 12.5px; font-weight: 800; margin-bottom: 1px; }
.meta { font-size: 11px; opacity: .7; margin-top: 2px; text-align: left; font-variant-numeric: tabular-nums; display: flex; gap: 8px; justify-content: flex-end; }
.del { border: 0; background: none; color: inherit; padding: 0; cursor: pointer; text-decoration: underline; font-size: 11px; }
.pic { display: block; max-width: min(260px, 100%); max-height: 320px; border-radius: 10px; margin-block: 3px 4px; cursor: zoom-in; background: var(--card-2); min-width: 120px; min-height: 80px; }
.empty { text-align: center; color: var(--muted); padding-block: 56px; line-height: 1.8; }
.empty .ico { font-size: 40px; display: block; }
.empty strong { display: block; font-family: var(--display); font-weight: 400; color: var(--chalk); font-size: 24px; margin-top: 6px; }

/* ---------- Composer ---------- */
footer { background: var(--pitch-2); border-top: 1px solid var(--line); flex: none; }
footer .wrap { padding-block: 10px; }
#composer { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; min-width: 0; resize: none; font: 15px/1.5 var(--body); color: var(--chalk); background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 9px 14px; max-height: 120px; }
textarea::placeholder { color: var(--muted); }
.round { flex: none; width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; }
.round:disabled { opacity: .4; cursor: default; }
.round svg { width: 21px; height: 21px; }
.send { background: var(--league); color: var(--league-ink); }
.send svg { transform: scaleX(-1); }
.attach { background: var(--card); color: var(--muted); border: 1px solid var(--line); }
.err { color: var(--danger); font-size: 12.5px; margin-top: 6px; }

/* ---------- Sign-in: floodlit stadium ---------- */
.screen {
  flex: 1; overflow-y: auto; display: flex;
  background:
    radial-gradient(60% 40% at 15% 0%, rgba(244,248,216,.16), transparent 70%),
    radial-gradient(60% 40% at 85% 0%, rgba(244,248,216,.16), transparent 70%),
    repeating-linear-gradient(90deg, var(--stripe) 0 48px, transparent 48px 96px),
    var(--pitch);
}
.card { margin: auto; width: 100%; max-width: 420px; padding-block: 32px; display: flex; flex-direction: column; gap: 14px; }
.card .badge { width: 64px; height: 64px; font-size: 30px; }
.card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.1; text-wrap: balance; }
.card p { margin: 0; color: var(--muted); line-height: 1.7; }
.flags { display: flex; gap: 10px; font-size: 22px; }
.tabs { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { flex: 1; border: 0; background: none; border-radius: 999px; padding: 8px; cursor: pointer; color: var(--muted); font-weight: 700; }
.tabs button[aria-selected="true"] { background: var(--turf); color: var(--turf-ink); }
label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; }
input[type="text"], input[type="email"], input[type="password"] {
  font: 15px var(--body); color: var(--chalk); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px;
}
.primary { border: 0; border-radius: 12px; padding: 12px; background: var(--turf); color: var(--turf-ink); font-weight: 800; font-size: 16px; cursor: pointer; }
.primary:disabled { opacity: .6; cursor: default; }
.link { align-self: center; border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 13.5px; padding: 4px; }
.ok { color: var(--turf); font-size: 13.5px; line-height: 1.6; }
code { background: var(--card); padding: 1px 6px; border-radius: 6px; direction: ltr; unicode-bidi: embed; }

.viewer { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); cursor: zoom-out; }
.viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }
@media (prefers-reduced-motion: no-preference) {
  .row.fresh { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: translateY(6px); opacity: .4; } }
  .lg, .strip, .send, .mine .bubble { transition: background-color .2s, color .2s; }
}
</style>
</head>
<body data-league="epl">

<!-- Setup missing -->
<section class="screen" id="setupScreen" hidden>
  <div class="card wrap">
    <div class="badge" aria-hidden="true">هلا</div>
    <h2>باقي خطوة الإعداد</h2>
    <p>عبّ ملف <code>config.js</code> برابط مشروع Supabase والمفتاح العام، وبعدها حدّث الصفحة. الخطوات كاملة في ملف <code>README.md</code>.</p>
  </div>
</section>

<!-- Sign in / sign up -->
<section class="screen" id="authScreen" hidden>
  <form class="card wrap" id="authForm" novalidate>
    <div class="badge" aria-hidden="true">هلا</div>
    <h2 id="authTitle">مدرج هلا</h2>
    <p id="authLead">نقاشات الكورة في الدوريات الخمس الكبرى. سجّل دخولك وخلنا نسولف.</p>
    <div class="flags" aria-hidden="true">🏴󠁧󠁢󠁥󠁮󠁧󠁿 🇪🇸 🇮🇹 🇩🇪 🇫🇷</div>
    <div class="tabs" role="tablist" id="authTabs">
      <button type="button" role="tab" id="tabIn" aria-selected="true">دخول</button>
      <button type="button" role="tab" id="tabUp" aria-selected="false">حساب جديد</button>
    </div>
    <label id="nameField" hidden>اسمك اللي يظهر للناس
      <input type="text" id="nameInput" maxlength="40" autocomplete="nickname">
    </label>
    <label id="emailField">الإيميل
      <input type="email" id="emailInput" autocomplete="email" dir="ltr" required>
    </label>
    <label id="passField"><span id="passLabel">كلمة المرور</span>
      <input type="password" id="passInput" autocomplete="current-password" dir="ltr" minlength="6" required>
    </label>
    <button class="primary" id="authBtn" type="submit">دخول</button>
    <div class="err" id="authErr" hidden></div>
    <div class="ok" id="authOk" hidden></div>
    <button class="link" id="forgotBtn" type="button">نسيت كلمة المرور؟</button>
    <button class="link" id="backBtn" type="button" hidden>رجوع لتسجيل الدخول</button>
  </form>
</section>

<!-- Chat -->
<header id="chatHeader" hidden>
  <div class="wrap top">
    <div class="badge" aria-hidden="true">هلا</div>
    <div class="brand">
      <h1>مدرج هلا</h1>
      <p id="meLine"></p>
    </div>
    <button class="ghost" id="signOutBtn" type="button">خروج</button>
  </div>
  <nav class="wrap leagues" id="chips" aria-label="الدوريات"></nav>
</header>
<div class="strip" id="strip" hidden><div class="wrap"><b id="leagueName"></b><span id="leagueCountry"></span></div></div>
<main id="scroller" hidden><div class="wrap" id="thread"></div></main>
<footer id="chatFooter" hidden>
  <div class="wrap">
    <form id="composer">
      <input type="file" id="picker" accept="image/*" hidden>
      <button class="round attach" id="attachBtn" type="button" aria-label="إرفاق صورة من الاستديو">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
      </button>
      <textarea id="msg" rows="1" maxlength="2000" placeholder="اكتب رأيك…" aria-label="الرسالة"></textarea>
      <button class="round send" id="sendBtn" type="submit" aria-label="إرسال" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
      </button>
    </form>
    <div class="err" id="err" hidden></div>
  </div>
</footer>
<div class="viewer" id="viewer" hidden><img id="viewerImg" alt=""></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
// The five big leagues. color/ink paint the tab when it's selected.
const CHANNELS = [
  { id: "epl",        short: "إنجليزي", flag: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", name: "الدوري الإنجليزي الممتاز", country: "إنجلترا", color: "#8f3fd6", ink: "#ffffff" },
  { id: "laliga",     short: "إسباني",  flag: "🇪🇸", name: "الدوري الإسباني",          country: "إسبانيا", color: "#ff4b3e", ink: "#ffffff" },
  { id: "seriea",     short: "إيطالي",  flag: "🇮🇹", name: "الدوري الإيطالي",          country: "إيطاليا", color: "#1aa3ff", ink: "#04131f" },
  { id: "bundesliga", short: "ألماني",  flag: "🇩🇪", name: "الدوري الألماني",          country: "ألمانيا", color: "#e4202b", ink: "#ffffff" },
  { id: "ligue1",     short: "فرنسي",   flag: "🇫🇷", name: "الدوري الفرنسي",           country: "فرنسا",   color: "#dae025", ink: "#0d1400" },
];
const BUCKET = "chat-images";
const PAGE = 200;
const $ = (id) => document.getElementById(id);

const cfg = window.HALA_CONFIG || {};
if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.supabase) {
  $("setupScreen").hidden = false;
  throw new Error("Hala: missing Supabase config");
}
// Read before the client clears the link details from the address bar.
const linkInfo = new URLSearchParams((location.hash || "").slice(1) + "&" + location.search.slice(1));
let recovering = linkInfo.get("type") === "recovery";
const linkError = linkInfo.get("error_code");
const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

let me = null;                 // auth user
let channel = CHANNELS[0].id;
try { channel = localStorage.getItem("hala.channel") || channel; } catch {}
if (!CHANNELS.some(c => c.id === channel)) channel = CHANNELS[0].id;
const byChannel = {};          // channel -> messages[] (ascending)
const names = {};              // user_id -> name
const signed = {};             // image_path -> { url, exp }
const seen = new Set();
let realtime = null;

/* ---------- Screens ---------- */
function show(view) {
  $("authScreen").hidden = view !== "auth";
  for (const id of ["chatHeader", "strip", "scroller", "chatFooter"]) $(id).hidden = view !== "chat";
}

/* ---------- Auth ---------- */
let mode = "in";
// Modes: in (sign in), up (sign up), forgot (ask for reset email), reset (set new password)
const MODE_TEXT = {
  in:     { title: "هلا وغلا", lead: "دردشة للشلة. سجّل دخولك أو سوّ حساب جديد.", btn: "دخول" },
  up:     { title: "هلا وغلا", lead: "دردشة للشلة. سجّل دخولك أو سوّ حساب جديد.", btn: "سوّ الحساب" },
  forgot: { title: "نسيت كلمة المرور؟", lead: "اكتب إيميلك ونرسل لك رابط تختار فيه كلمة مرور جديدة.", btn: "أرسل الرابط" },
  reset:  { title: "كلمة مرور جديدة", lead: "اختر كلمة مرور جديدة لحسابك.", btn: "احفظ كلمة المرور" },
};
function setMode(m) {
  mode = m;
  const t = MODE_TEXT[m];
  $("authTitle").textContent = t.title;
  $("authLead").textContent = t.lead;
  $("authBtn").textContent = t.btn;
  $("authTabs").hidden = m === "forgot" || m === "reset";
  $("tabIn").setAttribute("aria-selected", String(m === "in"));
  $("tabUp").setAttribute("aria-selected", String(m === "up"));
  $("nameField").hidden = m !== "up";
  $("emailField").hidden = m === "reset";
  $("passField").hidden = m === "forgot";
  $("passLabel").textContent = m === "reset" ? "كلمة المرور الجديدة" : "كلمة المرور";
  $("passInput").autocomplete = m === "in" ? "current-password" : "new-password";
  $("forgotBtn").hidden = m !== "in";
  $("backBtn").hidden = m !== "forgot";
  authMsg("", "");
}
$("forgotBtn").onclick = () => setMode("forgot");
$("backBtn").onclick = () => setMode("in");
$("tabIn").onclick = () => setMode("in");
$("tabUp").onclick = () => setMode("up");
function authMsg(err, ok) {
  $("authErr").textContent = err; $("authErr").hidden = !err;
  $("authOk").textContent = ok; $("authOk").hidden = !ok;
}
function authError(e) {
  const m = (e && e.message || "").toLowerCase();
  if (m.includes("invalid login")) return "الإيميل أو كلمة المرور غلط.";
  if (m.includes("not confirmed")) return "لازم تأكد إيميلك أول. شوف بريدك واضغط رابط التأكيد.";
  if (m.includes("already registered")) return "هالإيميل مسجل من قبل. جرّب تسجيل الدخول.";
  if (m.includes("different from the old")) return "اختر كلمة مرور غير القديمة.";
  if (m.includes("session") || m.includes("expired")) return "انتهت صلاحية الرابط. اطلب رابط جديد من \"نسيت كلمة المرور؟\".";
  if (m.includes("password")) return "كلمة المرور لازم تكون ٦ أحرف أو أكثر.";
  if (m.includes("rate")) return "محاولات كثيرة. انتظر شوي وجرّب.";
  return "صار خطأ: " + (e && e.message || "غير معروف");
}
$("authForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("emailInput").value.trim();
  const password = $("passInput").value;
  const name = $("nameInput").value.trim();
  if (mode === "forgot" && !email) return authMsg("اكتب إيميلك.", "");
  if (mode === "reset" && password.length < 6) return authMsg("كلمة المرور لازم تكون ٦ أحرف أو أكثر.", "");
  if ((mode === "in" || mode === "up") && (!email || !password)) return authMsg("اكتب الإيميل وكلمة المرور.", "");
  if (mode === "up" && !name) return authMsg("اكتب اسمك.", "");
  $("authBtn").disabled = true; authMsg("", "");
  try {
    if (mode === "forgot") {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
      if (error) throw error;
      authMsg("", "إذا الإيميل مسجل عندنا، بيوصلك رابط خلال دقايق. افتحه من نفس الجوال واختر كلمة مرور جديدة. شيّك على الـ Spam إذا ما لقيته.");
    } else if (mode === "reset") {
      const { error } = await sb.auth.updateUser({ password });
      if (error) throw error;
      recovering = false;
      $("passInput").value = "";
      startChat();
    } else if (mode === "in") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { name }, emailRedirectTo: location.origin + location.pathname },
      });
      if (error) throw error;
      if (!data.session) authMsg("", "تم! أرسلنا لك رابط تأكيد على الإيميل. اضغطه وبعدها سجّل دخول.");
    }
  } catch (err) {
    authMsg(authError(err), "");
  } finally {
    $("authBtn").disabled = false;
  }
});
$("signOutBtn").onclick = () => sb.auth.signOut();

let booted = false;
sb.auth.onAuthStateChange((event, session) => {
  const u = session?.user || null;
  if (event === "PASSWORD_RECOVERY") recovering = true;
  if (recovering && u) {
    me = u; booted = true;
    setTimeout(() => { show("auth"); if (mode !== "reset") setMode("reset"); }, 0);
    return;
  }
  if (booted && u?.id === me?.id) return;
  booted = true;
  me = u;
  // run outside the auth callback so Supabase calls inside don't deadlock
  setTimeout(() => {
    if (me) return startChat();
    stopChat();
    if (linkError === "otp_expired") { setMode("forgot"); authMsg("انتهت صلاحية الرابط. اكتب إيميلك ونرسل لك رابط جديد.", ""); }
  }, 0);
});

/* ---------- Data ---------- */
async function loadNames(ids) {
  const missing = [...new Set(ids)].filter(id => !(id in names));
  if (!missing.length) return;
  const { data } = await sb.from("profiles").select("id,name").in("id", missing);
  for (const id of missing) names[id] = "";
  for (const p of data || []) names[p.id] = p.name;
}

async function signUrls(paths) {
  const now = Date.now();
  const need = [...new Set(paths)].filter(p => !signed[p] || signed[p].exp < now + 60000);
  if (!need.length) return;
  const { data } = await sb.storage.from(BUCKET).createSignedUrls(need, 3600);
  for (const r of data || []) if (r.signedUrl) signed[r.path] = { url: r.signedUrl, exp: now + 3600000 };
}

async function loadChannel(ch) {
  const { data, error } = await sb.from("messages")
    .select("id,user_id,channel,body,image_path,created_at")
    .eq("channel", ch).order("created_at", { ascending: false }).limit(PAGE);
  if (error) { showErr("ما قدرنا نجيب الرسائل. تأكد من الاتصال."); return; }
  const fresh = (data || []).reverse();
  // keep anything realtime delivered while loading
  const extra = (byChannel[ch] || []).filter(m => !fresh.some(f => f.id === m.id));
  byChannel[ch] = fresh.concat(extra).sort((a, b) => a.created_at.localeCompare(b.created_at));
  for (const m of byChannel[ch]) seen.add(m.id);
}

async function startChat() {
  show("chat");
  renderChips();
  await loadNames([me.id]);
  $("meLine").textContent = "داخل باسم " + (names[me.id] || me.email);
  realtime?.unsubscribe();
  realtime = sb.channel("hala-messages")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (p) => {
      const m = p.new; const list = byChannel[m.channel];
      if (list && !list.some(x => x.id === m.id)) { list.push(m); if (m.channel === channel) render(false); }
    })
    .on("postgres_changes", { event: "DELETE", schema: "public", table: "messages" }, (p) => {
      for (const ch in byChannel) byChannel[ch] = byChannel[ch].filter(x => x.id !== p.old.id);
      render(false);
    })
    .subscribe();
  await openChannel(channel);
}

function stopChat() {
  realtime?.unsubscribe(); realtime = null;
  for (const k in byChannel) delete byChannel[k];
  show("auth"); setMode("in");
}

async function openChannel(ch) {
  channel = ch;
  try { localStorage.setItem("hala.channel", ch); } catch {}
  renderChips();
  if (!byChannel[ch]) { $("thread").textContent = ""; await loadChannel(ch); }
  render(true);
}

/* ---------- Render ---------- */
function renderChips() {
  const box = $("chips"); box.textContent = "";
  for (const c of CHANNELS) {
    const b = document.createElement("button");
    b.className = "lg"; b.type = "button"; b.title = c.name;
    b.style.setProperty("--c", c.color); b.style.setProperty("--ci", c.ink);
    b.setAttribute("aria-pressed", String(c.id === channel));
    const f = document.createElement("span"); f.className = "flag"; f.textContent = c.flag; f.setAttribute("aria-hidden", "true");
    const n = document.createElement("span"); n.className = "nm"; n.textContent = c.short;
    b.append(f, n);
    b.onclick = () => openChannel(c.id);
    box.append(b);
  }
  const cur = CHANNELS.find(c => c.id === channel);
  document.body.dataset.league = cur.id;
  $("leagueName").textContent = cur.name;
  $("leagueCountry").textContent = cur.flag + " " + cur.country;
}

function colorFor(id) {
  let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360} 45% 42%)`;
}

const timeFmt = new Intl.DateTimeFormat("ar", { hour: "numeric", minute: "2-digit" });
const dayFmt = new Intl.DateTimeFormat("ar", { weekday: "long", day: "numeric", month: "long" });

let renderSeq = 0;
async function render(jump) {
  const seq = ++renderSeq;
  const msgs = byChannel[channel] || [];
  await Promise.all([
    loadNames(msgs.map(m => m.user_id)),
    signUrls(msgs.filter(m => m.image_path).map(m => m.image_path)),
  ]).catch(() => {});
  if (seq !== renderSeq) return;
  const sc = $("scroller");
  const nearBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 120;
  const t = $("thread"); t.textContent = "";
  if (!msgs.length) {
    const e = document.createElement("div"); e.className = "empty";
    const ico = document.createElement("span"); ico.className = "ico"; ico.textContent = "⚽"; ico.setAttribute("aria-hidden", "true");
    const s = document.createElement("strong"); s.textContent = "الملعب فاضي";
    e.append(ico, s, "افتح النقاش عن " + CHANNELS.find(c => c.id === channel).name + ": نتيجة، انتقال، أو توقعك للجولة الجاية.");
    t.append(e);
  }
  let lastDay = "", lastUid = null;
  for (const m of [...msgs, ...pendingFor(channel)]) {
    const ts = new Date(m.created_at);
    const d = dayFmt.format(ts);
    if (d !== lastDay) {
      const el = document.createElement("div"); el.className = "day"; el.textContent = d; t.append(el);
      lastDay = d; lastUid = null;
    }
    const mine = m.user_id === me?.id;
    const row = document.createElement("div");
    row.className = "row " + (mine ? "mine" : "theirs") + (m.user_id === lastUid ? " cont" : "") + (seen.has(m.id) ? "" : " fresh");
    seen.add(m.id);
    const name = names[m.user_id] || "شخص";
    const av = document.createElement("div"); av.className = "avatar";
    av.style.background = colorFor(m.user_id); av.textContent = name.trim().charAt(0);
    const b = document.createElement("div"); b.className = "bubble";
    if (!mine && m.user_id !== lastUid) {
      const w = document.createElement("div"); w.className = "who"; w.textContent = name; w.style.color = colorFor(m.user_id);
      b.append(w);
    }
    const src = m.localUrl || signed[m.image_path]?.url;
    if (m.image_path || m.localUrl) {
      const pic = document.createElement("img"); pic.className = "pic"; pic.alt = "صورة";
      if (src) pic.src = src;
      pic.onclick = () => { if (pic.src) { $("viewerImg").src = pic.src; $("viewer").hidden = false; } };
      b.append(pic);
    }
    if (m.body) { const tx = document.createElement("div"); tx.textContent = m.body; b.append(tx); }
    const meta = document.createElement("div"); meta.className = "meta";
    if (mine && !m.pending) {
      const del = document.createElement("button"); del.className = "del"; del.type = "button"; del.textContent = "حذف";
      del.onclick = () => deleteMessage(m, del);
      meta.append(del);
    }
    const tm = document.createElement("span"); tm.textContent = m.pending ? "يُرسل…" : timeFmt.format(ts);
    meta.append(tm);
    b.append(meta);
    row.append(av, b);
    t.append(row);
    lastUid = m.user_id;
  }
  if (jump || nearBottom) sc.scrollTop = sc.scrollHeight;
}

/* ---------- Sending ---------- */
const pending = [];
const pendingFor = (ch) => pending.filter(p => p.channel === ch);
function showErr(text) { $("err").textContent = text; $("err").hidden = !text; }

const msgEl = $("msg"), sendBtn = $("sendBtn");
function grow() {
  msgEl.style.height = "auto"; msgEl.style.height = Math.min(msgEl.scrollHeight, 120) + "px";
  sendBtn.disabled = !msgEl.value.trim();
}
msgEl.addEventListener("input", grow);
msgEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});

async function insertMessage(row) {
  const { data, error } = await sb.from("messages").insert(row).select().single();
  if (error) throw error;
  const list = byChannel[data.channel] || (byChannel[data.channel] = []);
  if (!list.some(x => x.id === data.id)) list.push(data);
  seen.add(data.id);
  return data;
}

$("composer").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = msgEl.value.trim();
  if (!body) return;
  msgEl.value = ""; grow(); showErr("");
  const tmp = { id: "tmp" + Date.now(), user_id: me.id, channel, body, created_at: new Date().toISOString(), pending: true };
  pending.push(tmp); render(true);
  try {
    await insertMessage({ channel: tmp.channel, body });
  } catch {
    msgEl.value = body; grow();
    showErr("ما وصلت الرسالة. تأكد من الاتصال وجرّب مرة ثانية.");
  } finally {
    pending.splice(pending.indexOf(tmp), 1); render(false);
  }
});

async function deleteMessage(m, btn) {
  btn.disabled = true;
  const { error } = await sb.from("messages").delete().eq("id", m.id);
  if (error) { btn.disabled = false; showErr("ما انحذفت الرسالة. جرّب مرة ثانية."); return; }
  if (m.image_path) sb.storage.from(BUCKET).remove([m.image_path]);
  byChannel[m.channel] = byChannel[m.channel].filter(x => x.id !== m.id);
  render(false);
}

/* ---------- Photos ---------- */
$("attachBtn").onclick = () => $("picker").click();
$("viewer").onclick = () => { $("viewer").hidden = true; };
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("viewer").hidden = true; });

// Shrink big gallery photos so they upload fast and fit the 5 MB limit.
async function shrink(file) {
  if (file.type === "image/gif") return file;
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 1.5e6 && /^image\/(jpeg|png|webp)$/.test(file.type)) return file;
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((r) => c.toBlob((b) => r(b || file), "image/jpeg", 0.85));
  } catch { return file; }
}

$("picker").addEventListener("change", async () => {
  const file = $("picker").files[0];
  $("picker").value = "";
  if (!file) return;
  if (!file.type.startsWith("image/")) { showErr("اختر صورة فقط."); return; }
  showErr("");
  const caption = msgEl.value.trim();
  msgEl.value = ""; grow();
  const tmp = { id: "tmp" + Date.now(), user_id: me.id, channel, body: caption, created_at: new Date().toISOString(), localUrl: URL.createObjectURL(file), pending: true };
  pending.push(tmp); render(true);
  $("attachBtn").disabled = true;
  try {
    const blob = await shrink(file);
    const ext = { "image/png": "png", "image/webp": "webp", "image/gif": "gif" }[blob.type] || "jpg";
    const path = `${me.id}/${crypto.randomUUID()}.${ext}`;
    const up = await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type || "image/jpeg" });
    if (up.error) throw up.error;
    signed[path] = { url: tmp.localUrl, exp: Date.now() + 3000000 };
    await insertMessage({ channel: tmp.channel, body: caption || null, image_path: path });
  } catch (err) {
    msgEl.value = caption; grow();
    const m = String(err?.message || "").toLowerCase();
    if (m.includes("size") || m.includes("large")) showErr("الصورة كبيرة مرة. الحد ٥ ميجا.");
    else if (m.includes("mime")) showErr("نوع الصورة غير مدعوم. جرّب JPG أو PNG.");
    else showErr("ما انرفعت الصورة. تأكد من الاتصال وجرّب مرة ثانية.");
  } finally {
    pending.splice(pending.indexOf(tmp), 1);
    $("attachBtn").disabled = false;
    render(false);
  }
});

</script>
